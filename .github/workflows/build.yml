name: Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile
        run: cl /std:c++17 /EHsc /O2 main.cpp /link winhttp.lib bcrypt.lib /SUBSYSTEM:WINDOWS /OUT:DiscordVRStatus.exe
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: DiscordVRStatus
          path: DiscordVRStatus.exe
